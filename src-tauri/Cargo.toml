[package]
name = "milkman"
version = "0.0.1"
description = "MILKMAN — delivering fresh, cold and ready to drink packages"
authors = ["MIVIM"]
edition = "2021"

[lib]
name = "milkman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
regex = "1"
once_cell = "1"
sha2 = "0.10"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
